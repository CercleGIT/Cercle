<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Arena</title>

<style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080b18;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    h1 { color: #00eaff; text-shadow: 0 0 12px #00eaff; margin: 12px 0 4px; }

    #hud { display: flex; justify-content: center; gap: 25px; margin: 8px; font-weight: bold; }

    canvas {
      display: block;
      margin: auto;
      width: min(96vw, 850px);
      height: auto;
      border: 2px solid #00eaff;
      box-shadow: 0 0 25px #0066ff;
      background: #111936;
    }

    button {
      margin: 10px 5px;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #00c8ff;
      color: #001018;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #72edff; }

    #message { min-height: 24px; color: #ffdd57; font-weight: bold; }

    #mobileControls { display: none; margin-top: 8px; }

    @media (max-width: 700px) { #mobileControls { display: block; } }
  </style>
</head>

<body>
  <h1>CYBER ARENA</h1>

  <div id="hud">
    <span>Score : <b id="score">0</b></span>
    <span>Vies : <b id="lives">3</b></span>
    <span>Niveau : <b id="level">1</b></span>
  </div>

  <canvas id="game" width="850" height="500"></canvas>

  <div id="message">Détruis les drones ennemis !</div>

  <button onclick="startGame()">Commencer</button>
  <button onclick="shareScore()">Partager mon score</button>

  <div id="mobileControls">
    <button ontouchstart="keys.left=true" ontouchend="keys.left=false" ontouchcancel="keys.left=false">◀</button>
    <button ontouchstart="shoot()">TIRER</button>
    <button ontouchstart="keys.right=true" ontouchend="keys.right=false" ontouchcancel="keys.right=false">▶</button>
  </div>

<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const livesText = document.getElementById("lives");
    const levelText = document.getElementById("level");
    const message = document.getElementById("message");

    const keys = { left: false, right: false };

    let player;
    let enemies = [];
    let bullets = [];
    let particles = [];
    let score = 0;
    let lives = 3;
    let level = 1;
    let running = false;
    let lastEnemyTime = 0;
    let animationId;

    function startGame() {
      cancelAnimationFrame(animationId);

      player = {
        x: canvas.width / 2 - 25,
        y: canvas.height - 65,
        width: 50,
        height: 35,
        speed: 7,
        cooldown: 0
      };

      enemies = [];
      bullets = [];
      particles = [];
      score = 0;
      lives = 3;
      level = 1;
      running = true;
      lastEnemyTime = 0;

      updateHud();
      message.textContent = "Élimine les drones !";
      gameLoop(0);
    }

    function updateHud() {
      scoreText.textContent = score;
      livesText.textContent = lives;
      levelText.textContent = level;
    }

    function shoot() {
      if (!running || player.cooldown > 0) return;

      bullets.push({
        x: player.x + player.width / 2 - 3,
        y: player.y - 10,
        width: 6,
        height: 15,
        speed: 10
      });

      player.cooldown = 15;
    }

    document.addEventListener("keydown", event => {
      if (["ArrowLeft", "ArrowRight", " "].includes(event.key)) event.preventDefault();

      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") keys.left = true;
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") keys.right = true;
      if (event.code === "Space") shoot();
    });

    document.addEventListener("keyup", event => {
      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") keys.left = false;
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") keys.right = false;
    });

    function createEnemy() {
      const size = 35 + Math.random() * 18;

      enemies.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        width: size,
        height: size,
        speed: 1.5 + level * 0.35,
        color: Math.random() > 0.5 ? "#ff236f" : "#a855f7"
      });
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x,
          y,
          dx: (Math.random() - 0.5) * 7,
          dy: (Math.random() - 0.5) * 7,
          life: 30,
          color
        });
      }
    }

    function collision(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function update() {
      if (keys.left) player.x -= player.speed;
      if (keys.right) player.x += player.speed;

      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

      if (player.cooldown > 0) player.cooldown--;

      if (Date.now() - lastEnemyTime > Math.max(300, 1000 - level * 60)) {
        createEnemy();
        lastEnemyTime = Date.now();
      }

      bullets.forEach(bullet => { bullet.y -= bullet.speed; });
      bullets = bullets.filter(bullet => bullet.y > -20);

      enemies.forEach(enemy => { enemy.y += enemy.speed; });

      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];

        if (enemy.y > canvas.height) {
          enemies.splice(i, 1);
          lives--;
          updateHud();

          if (lives <= 0) {
            endGame();
            return;
          }
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        for (let j = bullets.length - 1; j >= 0; j--) {
          if (collision(enemies[i], bullets[j])) {
            const enemy = enemies[i];

            createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.color);

            enemies.splice(i, 1);
            bullets.splice(j, 1);

            score += 10;
            level = Math.floor(score / 100) + 1;
            updateHud();
            break;
          }
        }
      }

      for (const enemy of enemies) {
        if (collision(enemy, player)) {
          endGame();
          return;
        }
      }

      particles.forEach(particle => {
        particle.x += particle.dx;
        particle.y += particle.dy;
        particle.life--;
      });

      particles = particles.filter(particle => particle.life > 0);
    }

    function draw() {
      ctx.fillStyle = "#111936";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawStars();
      drawPlayer();

      bullets.forEach(bullet => {
        ctx.fillStyle = "#ffe600";
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ffe600";
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
        ctx.shadowBlur = 0;
      });

      enemies.forEach(enemy => {
        ctx.fillStyle = enemy.color;
        ctx.shadowBlur = 18;
        ctx.shadowColor = enemy.color;
        ctx.beginPath();
        ctx.arc(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.width / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(enemy.x + 10, enemy.y + 12, 7, 7);
        ctx.fillRect(enemy.x + enemy.width - 17, enemy.y + 12, 7, 7);
      });

      particles.forEach(particle => {
        ctx.globalAlpha = particle.life / 30;
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x, particle.y, 5, 5);
        ctx.globalAlpha = 1;
      });
    }

    function drawPlayer() {
      if (!player) return;
      ctx.fillStyle = "#00eaff";
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#00eaff";

      ctx.beginPath();
      ctx.moveTo(player.x + player.width / 2, player.y);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.closePath();
      ctx.fill();

      ctx.shadowBlur = 0;
    }

    function drawStars() {
      ctx.fillStyle = "#ffffff";

      for (let i = 0; i < 45; i++) {
        const x = (i * 137) % canvas.width;
        const y = (i * 79 + Date.now() / 25) % canvas.height;
        ctx.fillRect(x, y, 2, 2);
      }
    }

    function gameLoop() {
      if (!running) return;

      update();
      draw();

      if (running) animationId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
      running = false;
      cancelAnimationFrame(animationId);

      message.textContent = `Partie terminée ! Score final : ${score}`;
      draw();

      localStorage.setItem(
        "cyberArenaBestScore",
        Math.max(score, Number(localStorage.getItem("cyberArenaBestScore") || 0))
      );

      // Dans Cercle : on envoie le score à la page pour le classement
      if (window.parent !== window) {
        try { window.parent.postMessage({ type: "cercle-score", jeu: "cyber-arena", score }, window.location.origin); } catch (e) {}
      }
    }

    function shareScore() {
      const bestScore = localStorage.getItem("cyberArenaBestScore") || score || 0;
      const text = `J'ai obtenu ${bestScore} points dans Cyber Arena !`;
      const url = window.parent !== window ? window.location.origin + "/jeux/cyber-arena" : window.location.href;

      if (navigator.share) {
        navigator.share({ title: "Cyber Arena", text, url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(text + " " + url);
        alert("Message copié. Tu peux le publier sur ton réseau social.");
      }
    }

    draw();
  </script>
</body>
</html>
