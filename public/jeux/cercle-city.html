<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cercle City</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; font-family: Arial, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // ---------- Utilitaires ----------
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rndVille = mulberry32(20261024);   // même ville pour tous les joueurs
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
  const rr = (x, y, w, h, r) => { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); };

  // ---------- Ville ----------
  const B = 420, R = 130, N = 7, S = N * B;
  const buildings = [], parks = [];
  const palette = ['#334155', '#3b4a63', '#475569', '#2f3b52', '#52607a', '#44506b'];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const x0 = i * B + R / 2 + 14, y0 = j * B + R / 2 + 14, w = B - R - 28, r = rndVille();
    if (r < 0.14) parks.push({ x: x0, y: y0, w, h: w });
    else if (r < 0.5) buildings.push({ x: x0, y: y0, w, h: w, c: palette[Math.floor(rndVille() * palette.length)] });
    else {
      const g = 10, s = (w - g) / 2;
      for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++)
        buildings.push({ x: x0 + a * (s + g), y: y0 + b * (s + g), w: s, h: s, c: palette[Math.floor(rndVille() * palette.length)] });
    }
  }
  const MIN = -R / 2, MAX = S + R / 2;

  // ---------- Véhicules (3 modèles originaux) ----------
  const TYPES = {
    citadine:    { nom: 'Citadine',    max: 260, acc: 300, turn: 3.2, w: 30, h: 16, col: '#38bdf8' },
    sportive:    { nom: 'Sportive',    max: 340, acc: 420, turn: 3.6, w: 32, h: 15, col: '#f43f5e' },
    camionnette: { nom: 'Camionnette', max: 210, acc: 220, turn: 2.6, w: 38, h: 18, col: '#fbbf24' },
  };
  const parquees = [
    { t: 'citadine', x: 1160, y: 1240, a: 0, v: 0 },
    { t: 'sportive', x: 1360, y: 1285, a: Math.PI, v: 0 },
    { t: 'camionnette', x: 1280, y: 1130, a: Math.PI / 2, v: 0 },
  ];

  const initiales = parquees.map(v => ({ ...v }));

  function voiture(v, col) {
    const c = TYPES[v.t], w = c.w, h = c.h;
    ctx.save(); ctx.translate(v.x, v.y); ctx.rotate(v.a);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(-w / 2 + 2, -h / 2 + 3, w, h, 4); ctx.fill();
    ctx.fillStyle = col || c.col; rr(-w / 2, -h / 2, w, h, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(w * 0.08, -h / 2 + 2, w * 0.22, h - 4);
    ctx.fillStyle = '#fde68a'; ctx.fillRect(w / 2 - 3, -h / 2 + 1, 3, 3); ctx.fillRect(w / 2 - 3, h / 2 - 4, 3, 3);
    ctx.restore();
  }

  // ---------- Trafic ----------
  const trafic = [];
  const couleursTrafic = ['#a78bfa', '#34d399', '#f472b6', '#94a3b8', '#fb923c', '#60a5fa'];
  const horsGrille = (k, l) => k < 0 || l < 0 || k > N || l > N;
  function choisirDirection(c) {
    const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([a, b]) => !(a === -c.dk && b === -c.dl) && !horsGrille(c.k + a, c.l + b));
    const [a, b] = opts[Math.floor(Math.random() * opts.length)];
    c.dk = a; c.dl = b; c.t = 0;
  }
  function creerTrafic(n) {
    for (let i = 0; i < n; i++) {
      const c = { k: Math.floor(Math.random() * (N + 1)), l: Math.floor(Math.random() * (N + 1)), dk: 0, dl: 0, t: 0, vit: 80 + Math.random() * 60, pause: 0, col: couleursTrafic[i % couleursTrafic.length], x: 0, y: 0, a: 0 };
      c.dk = 1; c.dl = 0; choisirDirection(c); c.t = Math.random() * B;
      trafic.push(c); positionTrafic(c);
    }
  }
  function positionTrafic(c) {
    const off = R / 4;
    c.x = c.k * B + c.dk * c.t - c.dl * off;
    c.y = c.l * B + c.dl * c.t + c.dk * off;
    c.a = Math.atan2(c.dl, c.dk);
  }
  function avancerTrafic(c, dt) {
    if (c.pause > 0) { c.pause -= dt; return; }
    c.t += c.vit * dt;
    if (c.t >= B) { c.k += c.dk; c.l += c.dl; choisirDirection(c); }
    positionTrafic(c);
  }

  // ---------- État du jeu ----------
  let etat = 'menu', argent = 0, temps = 180, heure = 0, msg = '', msgT = 0, accidentT = 0, missionsFaites = 0;
  let p, mission, cam = { x: 1260, y: 1260 };
  const joy = { id: null, actif: false, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0 };
  const touches = new Set();

  function noeud() { return { k: 1 + Math.floor(Math.random() * (N - 1)), l: 1 + Math.floor(Math.random() * (N - 1)) }; }
  function nouvelleMission() {
    const a = noeud();
    let b = noeud();
    while (Math.abs(a.k - b.k) + Math.abs(a.l - b.l) < 4) b = noeud();
    mission = { phase: 'colis', px: a.k * B, py: a.l * B, dx: b.k * B, dy: b.l * B, reste: 0 };
    mission.dist = Math.hypot(mission.dx - mission.px, mission.dy - mission.py);
  }
  function demarrer() {
    p = { x: 1260, y: 1260, voiture: null };
    parquees.forEach((v, i) => Object.assign(v, initiales[i]));
    argent = 0; temps = 180; heure = 0; missionsFaites = 0; msg = ''; accidentT = 0;
    trafic.length = 0; creerTrafic(16);
    nouvelleMission();
    etat = 'jeu';
  }
  function fin() {
    etat = 'fin';
    if (p && p.voiture) { p.voiture = null; }
    if (window.parent !== window) {
      try { window.parent.postMessage({ type: 'cercle-score', jeu: 'cercle-city', score: Math.max(0, Math.round(argent)) }, window.location.origin); } catch (e) {}
    }
  }
  function annoncer(t) { msg = t; msgT = 2.5; }

  // ---------- Entrées ----------
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
    touches.add(k);
    if (etat !== 'jeu') { if (k === 'enter' || k === ' ') demarrer(); return; }
    if (k === 'e' || k === ' ' || k === 'enter') action();
  });
  addEventListener('keyup', e => touches.delete(e.key.toLowerCase()));
  function vecteur() {
    let x = 0, y = 0;
    if (touches.has('arrowleft') || touches.has('a') || touches.has('q')) x -= 1;
    if (touches.has('arrowright') || touches.has('d')) x += 1;
    if (touches.has('arrowup') || touches.has('w') || touches.has('z')) y -= 1;
    if (touches.has('arrowdown') || touches.has('s')) y += 1;
    x += joy.dx; y += joy.dy;
    const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    return [x, y, Math.min(1, m)];
  }
  cv.addEventListener('pointerdown', e => {
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    window.focus();
    if (etat !== 'jeu') { demarrer(); return; }
    if (e.clientX > W - 110 && e.clientY > H - 110) { action(); return; }
    if (joy.id === null && e.clientX < W * 0.65) {
      joy.id = e.pointerId; joy.actif = true; joy.ox = joy.x = e.clientX; joy.oy = joy.y = e.clientY; joy.dx = joy.dy = 0;
    }
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerId !== joy.id) return;
    const dx = e.clientX - joy.ox, dy = e.clientY - joy.oy, d = Math.hypot(dx, dy), max = 50, k = d > max ? max / d : 1;
    joy.x = joy.ox + dx * k; joy.y = joy.oy + dy * k; joy.dx = dx * k / max; joy.dy = dy * k / max;
  });
  const finDoigt = e => { if (e.pointerId === joy.id) { joy.id = null; joy.actif = false; joy.dx = joy.dy = 0; } };
  cv.addEventListener('pointerup', finDoigt);
  cv.addEventListener('pointercancel', finDoigt);

  // ---------- Actions ----------
  function proche() {
    let best = null, bd = 48;
    for (const v of parquees) { if (v === p.voiture) continue; const d = Math.hypot(v.x - p.x, v.y - p.y); if (d < bd) { bd = d; best = v; } }
    return best;
  }
  function action() {
    if (etat !== 'jeu') return;
    if (p.voiture) {
      const v = p.voiture; v.v = 0;
      p.x = v.x + Math.cos(v.a + Math.PI / 2) * 30; p.y = v.y + Math.sin(v.a + Math.PI / 2) * 30;
      p.voiture = null; annoncer('Tu descends du véhicule');
    } else {
      const v = proche();
      if (v) { p.voiture = v; annoncer(TYPES[v.t].nom + ' : en route !'); }
    }
  }

  // ---------- Collisions ----------
  function pousser(o, r) {
    let touche = false;
    for (const b of buildings) {
      if (o.x + r < b.x || o.x - r > b.x + b.w || o.y + r < b.y || o.y - r > b.y + b.h) continue;
      const cx = clamp(o.x, b.x, b.x + b.w), cy = clamp(o.y, b.y, b.y + b.h);
      let dx = o.x - cx, dy = o.y - cy, d = Math.hypot(dx, dy);
      if (d < r) {
        if (d === 0) { dx = 1; dy = 0; d = 1; }
        o.x = cx + dx / d * r; o.y = cy + dy / d * r; touche = true;
      }
    }
    o.x = clamp(o.x, MIN + r, MAX - r); o.y = clamp(o.y, MIN + r, MAX - r);
    return touche;
  }

  // ---------- Mise à jour ----------
  function marcher(ix, iy, dt) {
    p.x += ix * 150 * dt; p.y += iy * 150 * dt;
    pousser(p, 8);
  }
  function conduire(v, ix, iy, m, dt) {
    const c = TYPES[v.t];
    if (m > 0.15) {
      const cible = Math.atan2(iy, ix), d = angDiff(cible, v.a);
      const vit = Math.min(1, Math.abs(v.v) / 60 + 0.35), pas = c.turn * dt * vit;
      v.a += clamp(d, -pas, pas);
      const align = Math.max(0.3, Math.cos(d));
      v.v += clamp(c.max * m * align - v.v, -c.acc * dt * 1.5, c.acc * dt);
    } else v.v *= Math.max(0, 1 - 1.8 * dt);
    v.x += Math.cos(v.a) * v.v * dt; v.y += Math.sin(v.a) * v.v * dt;
    if (pousser(v, 13)) v.v *= 0.5;
  }
  function update(dt) {
    temps -= dt; if (temps <= 0) { temps = 0; fin(); return; }
    heure = (heure + dt) % 120;
    if (msgT > 0) msgT -= dt;
    if (accidentT > 0) accidentT -= dt;
    const [ix, iy, m] = vecteur();
    if (p.voiture) { conduire(p.voiture, ix, iy, m, dt); p.x = p.voiture.x; p.y = p.voiture.y; }
    else marcher(ix, iy, dt);
    for (const c of trafic) {
      avancerTrafic(c, dt);
      if (p.voiture) {
        const d = Math.hypot(c.x - p.x, c.y - p.y);
        if (d < 26) {
          const nx = (p.x - c.x) / (d || 1), ny = (p.y - c.y) / (d || 1);
          p.voiture.x += nx * (26 - d); p.voiture.y += ny * (26 - d); p.voiture.v *= 0.3; c.pause = 1.2;
          if (accidentT <= 0) { argent = Math.max(0, argent - 10); accidentT = 1.5; annoncer('Accident ! −10 €'); }
        }
      }
    }
    // Mission
    if (mission.phase === 'colis') {
      if (Math.hypot(p.x - mission.px, p.y - mission.py) < 50) {
        mission.phase = 'livraison'; mission.reste = mission.dist / 150 + 18;
        annoncer('Colis récupéré ! Livre-le à temps');
      }
    } else {
      mission.reste -= dt;
      if (Math.hypot(p.x - mission.dx, p.y - mission.dy) < 50) {
        const gain = Math.round(100 + Math.max(0, mission.reste) * 2);
        argent += gain; missionsFaites++; annoncer('Livraison réussie ! +' + gain + ' €'); nouvelleMission();
      } else if (mission.reste <= 0) { annoncer('Trop tard ! Mission manquée'); nouvelleMission(); }
    }
    cam.x += (p.x - cam.x) * Math.min(1, dt * 6); cam.y += (p.y - cam.y) * Math.min(1, dt * 6);
  }

  // ---------- Dessin ----------
  const echelle = () => clamp(Math.min(W, H) / 520, 0.8, 1.4);
  function dessiner() {
    const e = echelle();
    ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.scale(e, e); ctx.translate(-cam.x, -cam.y);
    const vx0 = cam.x - W / 2 / e - 60, vx1 = cam.x + W / 2 / e + 60, vy0 = cam.y - H / 2 / e - 60, vy1 = cam.y + H / 2 / e + 60;
    // trottoirs / sol
    ctx.fillStyle = '#273449'; ctx.fillRect(MIN, MIN, MAX - MIN, MAX - MIN);
    // routes
    ctx.fillStyle = '#3a4152';
    for (let k = 0; k <= N; k++) { ctx.fillRect(k * B - R / 2, MIN, R, MAX - MIN); ctx.fillRect(MIN, k * B - R / 2, MAX - MIN, R); }
    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 3; ctx.setLineDash([22, 22]);
    for (let k = 0; k <= N; k++) {
      ctx.beginPath(); ctx.moveTo(k * B, MIN); ctx.lineTo(k * B, MAX); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(MIN, k * B); ctx.lineTo(MAX, k * B); ctx.stroke();
    }
    ctx.setLineDash([]);
    // parcs
    ctx.fillStyle = '#166534';
    for (const q of parks) if (q.x < vx1 && q.x + q.w > vx0 && q.y < vy1 && q.y + q.h > vy0) { rr(q.x, q.y, q.w, q.h, 14); ctx.fill(); }
    // bâtiments
    const nuit = 0.45 * (0.5 - 0.5 * Math.cos(heure / 120 * Math.PI * 2));
    for (const b of buildings) {
      if (b.x > vx1 || b.x + b.w < vx0 || b.y > vy1 || b.y + b.h < vy0) continue;
      ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(b.x + 6, b.y + 8, b.w, b.h);
      ctx.fillStyle = b.c; ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(b.x + 8, b.y + 8, b.w - 16, b.h - 16);
      if (nuit > 0.2) {
        ctx.fillStyle = 'rgba(253,224,71,.6)';
        for (let x = b.x + 14; x < b.x + b.w - 14; x += 26) for (let y = b.y + 14; y < b.y + b.h - 14; y += 26) if (((x * 7 + y * 13) | 0) % 3) ctx.fillRect(x, y, 8, 8);
      }
    }
    // marqueurs de mission
    if (mission) {
      const pulse = 1 + 0.15 * Math.sin(Date.now() / 200);
      const cible = mission.phase === 'colis' ? [mission.px, mission.py, '#22d3ee', 'P'] : [mission.dx, mission.dy, '#facc15', 'D'];
      ctx.fillStyle = cible[2]; ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(cible[0], cible[1], 55 * pulse, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(cible[0], cible[1], 24, 0, 7); ctx.fill();
      ctx.fillStyle = '#0b1220'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(cible[3], cible[0], cible[1] + 1);
    }
    // véhicules
    for (const c of trafic) voiture({ t: 'citadine', x: c.x, y: c.y, a: c.a }, c.col);
    const voisin = p && !p.voiture ? proche() : null;
    for (const v of parquees) {
      voiture(v);
      if (v === voisin) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(v.x, v.y, 30, 0, 7); ctx.stroke(); }
    }
    // joueur à pied
    if (p && !p.voiture) {
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(p.x + 2, p.y + 4, 9, 6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#22d3ee'; ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, 7); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.restore();
    // nuit
    if (nuit > 0) { ctx.fillStyle = 'rgba(5,10,40,' + nuit + ')'; ctx.fillRect(0, 0, W, H); }
    if (etat === 'jeu') interface_();
  }

  function interface_() {
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(10, 10, 170, 56, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Arial';
    ctx.fillText('💰 ' + argent + ' €', 22, 34);
    ctx.fillText('⏱ ' + Math.ceil(temps) + ' s', 22, 58);
    // mini-carte
    const t = Math.min(110, Math.min(W, H) * 0.28), mx = W - t - 10, my = 10, k = t / (MAX - MIN);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(mx, my, t, t, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(148,163,184,.6)'; ctx.lineWidth = 1;
    for (let i = 0; i <= N; i++) {
      ctx.beginPath(); ctx.moveTo(mx + (i * B - MIN) * k, my); ctx.lineTo(mx + (i * B - MIN) * k, my + t); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mx, my + (i * B - MIN) * k); ctx.lineTo(mx + t, my + (i * B - MIN) * k); ctx.stroke();
    }
    const cible = mission.phase === 'colis' ? [mission.px, mission.py, '#22d3ee'] : [mission.dx, mission.dy, '#facc15'];
    ctx.fillStyle = cible[2]; ctx.beginPath(); ctx.arc(mx + (cible[0] - MIN) * k, my + (cible[1] - MIN) * k, 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(mx + (p.x - MIN) * k, my + (p.y - MIN) * k, 3, 0, 7); ctx.fill();
    // flèche vers l'objectif
    const dist = Math.hypot(cible[0] - p.x, cible[1] - p.y);
    if (dist > 120) {
      const a = Math.atan2(cible[1] - p.y, cible[0] - p.x), r = Math.min(W, H) * 0.36;
      ctx.save(); ctx.translate(W / 2 + Math.cos(a) * r, H / 2 + Math.sin(a) * r); ctx.rotate(a);
      ctx.fillStyle = cible[2]; ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -10); ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    // mission
    ctx.textAlign = 'center'; ctx.font = 'bold 16px Arial';
    const texte = mission.phase === 'colis' ? 'Va chercher le colis (P) — ' + Math.round(dist) + ' m' : 'Livre le colis (D) — ' + Math.max(0, Math.ceil(mission.reste)) + ' s · ' + Math.round(dist) + ' m';
    ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(W / 2 - 170, H - 44, 340, 30, 8); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(texte, W / 2, H - 23);
    if (msgT > 0) { ctx.fillStyle = '#facc15'; ctx.font = 'bold 20px Arial'; ctx.fillText(msg, W / 2, 100); }
    if (!p.voiture && proche()) { ctx.fillStyle = '#fff'; ctx.font = 'bold 15px Arial'; ctx.fillText('E / bouton : monter dans le véhicule', W / 2, H - 56); }
    // bouton d'action tactile
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(W - 55, H - 55, 38, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial'; ctx.fillText(p.voiture ? 'SORTIR' : 'ENTRER', W - 55, H - 49);
    // joystick
    if (joy.actif) {
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(joy.x, joy.y, 22, 0, 7); ctx.fill();
    }
  }

  function ecran(titre, lignes) {
    ctx.fillStyle = 'rgba(8,11,24,.82)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#22d3ee'; ctx.font = 'bold ' + clamp(W / 11, 26, 52) + 'px Arial'; ctx.fillText(titre, W / 2, H * 0.22);
    ctx.fillStyle = '#fff'; ctx.font = clamp(W / 28, 14, 20) + 'px Arial';
    lignes.forEach((l, i) => ctx.fillText(l, W / 2, H * 0.34 + i * clamp(W / 20, 24, 32)));
    ctx.fillStyle = '#facc15'; ctx.font = 'bold ' + clamp(W / 24, 16, 24) + 'px Arial';
    ctx.fillText(etat === 'menu' ? 'Touche l’écran ou appuie sur Entrée pour jouer' : 'Touche pour rejouer', W / 2, H * 0.34 + lignes.length * clamp(W / 20, 24, 32) + 40);
  }

  let dernier = performance.now();
  function boucle(now) {
    const dt = Math.min(0.05, (now - dernier) / 1000); dernier = now;
    if (!p) p = { x: 1260, y: 1260, voiture: null };
    if (etat === 'jeu') update(dt);
    else heure = (heure + dt) % 120;
    if (!mission) nouvelleMission();
    dessiner();
    if (etat === 'menu') ecran('CERCLE CITY', ['Livre des colis dans la ville en 3 minutes.', 'Monte dans un véhicule (voiture bleue, rouge, jaune).', 'Flèches / ZQSD pour bouger, E pour entrer ou sortir.', 'Sur téléphone : glisse le doigt à gauche pour te diriger.', 'Évite les accidents : −10 € chacun !']);
    if (etat === 'fin') ecran('TEMPS ÉCOULÉ', ['Argent gagné : ' + argent + ' €', 'Livraisons réussies : ' + missionsFaites, 'Ton score est enregistré dans le classement.']);
    requestAnimationFrame(boucle);
  }
  requestAnimationFrame(boucle);
})();
</script>

</html>
