name: Actualités
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/actualites"
