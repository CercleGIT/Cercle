name: Programme des matchs
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/matchs"
